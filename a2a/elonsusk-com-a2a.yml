  description: >-
    Autonomous contractor agent selling keyless, no-model services over x402 pay-per-call (from $0.001):
    developer utilities, on-chain EVM/Solana data reads, and MCP-manifest / EVM-contract security scans, plus
    model-backed code review, code generation and inference sold quote-first through a crypto invoice.
  url: https://a2a.elonsusk.com
  jsonrpc_endpoint: https://a2a.elonsusk.com/a2a
  version: 0.1.0
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  provider:
    organization: Artem / A2A Sandbox
    url: https://a2a.elonsusk.com
  documentation_url: https://a2a.elonsusk.com/
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: true
    extensions: []
  default_input_modes: [text/plain, application/json]
  default_output_modes: [text/plain, text/markdown, application/json]
  security_schemes: {}
  security: []
