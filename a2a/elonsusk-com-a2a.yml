    (/.well-known/apievangelist-negative-control-7f3a.json) returns the app's real JSON 404
    ({"detail":"Not Found"}, 22 bytes), so the 200s are served documents, not a catch-all. Ownership is not
    in question: provider.organization is "Artem / A2A Sandbox" with provider.url https://a2a.elonsusk.com,
    the OpenAPI at the same origin declares the agent-card, agents-manifest and x402-discovery routes as
    operations, /.well-known/x402.json points back at this card, and the card's endpoints block names every
    other route this origin serves.
