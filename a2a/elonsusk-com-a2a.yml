conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming,
    pushNotifications and stateTransitionHistory. protocolVersion is present at the top level (pass),
    declared as "1.0". skills is an ARRAY (pass) of 28 skills, each with id, name, description, tags,
    inputModes, outputModes and examples. All three optional discriminators are present. The card carries
    BOTH shapes at once — the 0.3-style top-level url/preferredTransport/protocolVersion triple AND a 1.0-style
    supportedInterfaces[] block — so it passes the structural checks under either reading. The deviations
    below are real, and several would trip a strict client, but none is a hard-check failure.
  deviations:
  - field: schema_version
    observed: '"a2a-like-mvp-1"'
    note: >-
      The card describes itself as "A2A-like", which is candid: the JSON-RPC method set and several error
      codes follow pre-0.3 A2A drafts rather than any published release.
  - field: protocolVersion
    observed: '"1.0"'
    note: >-
      Not a published A2A version string; the specification's releases are 0.2.x, 0.3.0 and 1.0.0. A client
      matching on an exact version will not match. The card also duplicates the value in a snake_case
      protocol_version and preferred_transport pair, which no A2A revision defines.
  - field: url
    observed: 'https://a2a.elonsusk.com (canonical card) vs https://a2a.elonsusk.com/a2a (legacy card and supportedInterfaces[0].url)'
    note: >-
      On the canonical card the top-level url is the bare origin, and a JSON-RPC POST to it returns 405
      Method Not Allowed. The JSON-RPC endpoint is only correct in supportedInterfaces[0].url and on the
      legacy /.well-known/agent.json. A 0.3-style client following url from the canonical path cannot reach
      the agent.
  - field: jsonrpc_methods / transports[0].methods
    observed: 'tasks/send, tasks/get, tasks/cancel (plus SendMessage/GetTask/CancelTask and message/send aliases listed in transports)'
    note: >-
      tasks/send is the pre-0.3 method name; A2A 0.3.0 and 1.0.0 use message/send. The transports block
      claims message/send is also accepted, which was not exercised (it would create a task). Neither
      tasks/resubscribe, tasks/pushNotificationConfig/* nor agent/getAuthenticatedExtendedCard is
      implemented (the last returns -32601, consistent with the card not declaring extended-card support).
  - field: JSON-RPC error codes
    observed: 'code 404 "task not found" for an unknown task id'
    note: >-
      A2A defines -32001 TaskNotFoundError. The responder is otherwise JSON-RPC 2.0-correct (-32600 for a bad
      envelope, -32601 for an unknown method, -32602 for missing params).
  - field: securitySchemes / security
    observed: '{} and []'
    note: >-
      No authentication scheme at all, and unlike a card using the a2a-x402 extension, no
      capabilities.extensions[] entry declares the payment protocol either. The x402 requirement is stated
      out of band — in capabilityTags ("x402_pay_per_call", "standard_x402_v2"), in each skill's examples[]
      prose, in the non-standard pricing/payment_methods/how_to_order blocks, and in the separate
      /.well-known/x402.json document. An A2A client cannot learn from the standard fields that payment is
      the access model.
  - field: skills[].priceUsd / exampleInput
    observed: present on 24 skills
    note: Non-standard skill fields. Useful, and consistent with /.well-known/x402.json, but outside the AgentSkill schema.
  - field: skills[]
    observed: 28 declared; the service exposes 30
    note: shell.run and file.deliver are missing from the card (see skills_not_in_card).
  - field: capabilities.extensions / signatures / iconUrl
    observed: absent
    note: No extensions, no JWS signature block; the card's authenticity rests on TLS to a2a.elonsusk.com (Cloudflare-fronted).
  - field: non-standard top-level keys
    observed: endpoints, transports, interfaces, auth, capabilityTags, legacy_capabilities, pricing, registryTags, payment_methods, payment_notes, how_to_order, task_state_machine, jsonrpc_methods, apiEndpoint, baseUrl, homepage, author, wellKnownURI
    note: >-
      Roughly two thirds of the 22.8 KB card is outside the AgentCard schema. Much of it is genuinely useful
      (a full endpoint map, the task state machine, the payment rails), but it is unreadable to a schema-
      strict client and duplicates what /.well-known/x402.json and the OpenAPI already publish.
surface_relationship:
  note: >-
    Three doors onto one task queue, all on a2a.elonsusk.com. A2A JSON-RPC at /a2a (tasks/send, tasks/get,
    tasks/cancel); REST at /v1/tasks (create returns a quote and a multi-chain crypto invoice keyed on the
    task id as memo, poll GET /v1/tasks/{id}); and x402 pay-per-call at POST /x402/{skill}, which on a valid
    PAYMENT-SIGNATURE "settles, creates an A2A task (marked paid), returns receipt + artifact" per the
    contract. The OpenAPI (openapi/elonsusk-com-openapi.json) describes all three plus the discovery
    documents; /.well-known/x402.json describes the 27 priced endpoints with JSON Schema input/output; the
    card describes the 28 skills. No MCP server is hosted (/mcp and /.well-known/mcp.json 404) although the
    agent sells an MCP-manifest security scan as a skill. The ZeroClaw page at /showcase/zeroclaw describes a
    separate Solana Pay cashier that "delegates paid tasks to the live A2A contractor" — a bounty submission
    built on top of this agent, not a second agent.
observations:
- >-
  GET /v1/tasks is unauthenticated and returns the entire task history (61 tasks at probe time, ~700 KB)
  including each task's input, quote, invoice address and memo, payment notes and result, and artifact
  entries whose path field is the operator's local Windows filesystem path. Nothing was copied from it into
  this repo beyond the shape recorded in data-model/.
- >-
  POST /v1/tasks/{task_id}/mark-paid and POST /v1/payments/webhook/{provider} are in the public contract
  with no securityScheme; whether they verify a signature server-side is not stated in the contract.
- >-
  /healthz reports ollama degraded (the local model rail behind the four model-backed skills), so at probe
  time code.review, code.generate, inference.complete and external.llm.delegate were "delivered when a rail
  is up", exactly as their card descriptions say. /v1/metrics is public and reports 61 jobs, 11 completed,
  $0.01 of external real revenue against a $100 target.
