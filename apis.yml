aid: elonsusk-com
name: Artem / A2A Sandbox
description: >-
  Artem / A2A Sandbox is a one-operator agent-commerce sandbox that runs a paid "Sandbox Contractor Agent"
  at a2a.elonsusk.com: an Agent2Agent (A2A) JSON-RPC agent selling 28 skills — keyless developer utilities
  (JSON/YAML/CSV conversion, hashing incl. keccak256, base64/hex/base58, JWT decode, UUID, semver, epoch),
  on-chain data reads (EVM and Solana balances, ERC-20 metadata, gas price, transaction status, SPL supply)
  and security scans (MCP tool-manifest risk, EVM contract bytecode signals) — plus model-backed code review,
  code generation and inference sold quote-first. Every skill is payable per call over the x402 v2 HTTP
  payment protocol (HTTP 402 + PAYMENT-REQUIRED challenge, USDC on Base or Solana, from $0.001) at
  POST /x402/{skill}, or through a classic multi-chain crypto invoice (SOL, USDC, ETH, BTC) on the REST task
  API. The same FastAPI origin publishes an OpenAPI 3.1.0 contract at /openapi.json with Swagger UI at /docs,
  an A2A agent card at /.well-known/agent-card.json, an x402 discovery document at /.well-known/x402.json,
  and live health and revenue-metrics endpoints. The registrable domain elonsusk.com itself serves no
  website (TLS refused, HTTP 401); the a2a subdomain is the whole public surface.
