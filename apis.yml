apis:
- aid: elonsusk-com:sandbox-contractor-agent-rest-api
  name: Sandbox Contractor Agent REST API
  description: >-
    The HTTP surface of the Sandbox Contractor Agent, published as an OpenAPI 3.1.0 document (FastAPI,
    info.title "A2A Autonomous Trader Agent", version 0.1.0) at https://a2a.elonsusk.com/openapi.json with
    Swagger UI at /docs and ReDoc at /redoc. 24 operations across 24 paths: the x402 pay-per-call gate
    POST /x402/{skill} (27 priced skills; an unpaid call returns HTTP 402 with a PAYMENT-REQUIRED header and
    x402 v2 PaymentRequirements for USDC on Base eip155:8453 and Solana), the quote-first task API
    (POST /v1/tasks creates a task and returns a quote plus a multi-chain crypto invoice, GET /v1/tasks and
    GET /v1/tasks/{task_id} read state, POST /v1/tasks/{task_id}/mark-paid), a public lead-intake form
    (POST /v1/leads), payment-provider webhooks (POST /v1/payments/webhook/{provider} for NOWPayments and
    CoinGate), the well-known discovery documents (agent card, agents manifest, x402 discovery), live
    /health, /healthz and /v1/metrics, and a set of showcase pages. No authentication scheme is declared or
    used; access is gated by payment.
  humanURL: https://a2a.elonsusk.com/docs
  baseURL: https://a2a.elonsusk.com
