- aid: elonsusk-com:sandbox-contractor-agent-a2a
  name: Sandbox Contractor Agent (A2A)
  description: >-
    Agent2Agent protocol surface: an agent card served from https://a2a.elonsusk.com/.well-known/agent-card.json
    (and the legacy /.well-known/agent.json) declaring protocolVersion "1.0", JSONRPC transport, version 0.1.0,
    provider "Artem / A2A Sandbox", 28 skills each carrying inputModes, outputModes, tags, an example and — for
    the 24 keyless skills — a priceUsd from $0.001 to $0.02. The JSON-RPC 2.0 endpoint at
    https://a2a.elonsusk.com/a2a implements tasks/send, tasks/get and tasks/cancel (plus message/send and the
    SendMessage/GetTask/CancelTask aliases per the card's transports block); it answers a live probe with a
    JSON-RPC error for an unknown task id and -32601 for an unknown method. Streaming and push notifications
    are declared unsupported; stateTransitionHistory is supported and a nine-state task state machine is
    published in the card. No securitySchemes: the gate is payment (x402 pay-per-call or a crypto invoice
    whose memo is the task id).
  humanURL: https://a2a.elonsusk.com/
  baseURL: https://a2a.elonsusk.com/a2a
