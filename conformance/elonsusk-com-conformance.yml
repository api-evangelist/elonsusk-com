summary: >-
  The Sandbox Contractor Agent's conformance profile is the agent-commerce protocol stack and nothing else:
  an A2A-shaped agent card (graded conformant with deviations), JSON-RPC 2.0, and — verified live — the x402
  v2 HTTP payment protocol with a PAYMENT-REQUIRED challenge carrying PaymentRequirements for USDC on Base
  (CAIP-2 eip155:8453) and Solana, settled through the PayAI facilitator or an on-chain invoice bridge. It
  publishes its own x402 discovery document at /.well-known/x402.json, which is the contract-level
  signature for this market. It declares no OAuth/OIDC, no RFC 9457 problem details, no RFC 9116
  security.txt, no RFC 9727 API catalog, no APIs.json, no RFC 8594 sunset signalling, no MCP server, and no
  certification or compliance program.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '1.0 (as declared; not a published release string)'
  conforms: true
  evidence: >-
    a2a/elonsusk-com-agent-card.json — protocolVersion "1.0", supportedInterfaces[0] {url
    https://a2a.elonsusk.com/a2a, protocolBinding JSONRPC}, capabilities object, skills[] of 28; POST
    https://a2a.elonsusk.com/a2a answered tasks/get for an unknown id with a JSON-RPC error and an unknown
    method with -32601. Graded conformant in a2a/elonsusk-com-a2a.yml.
  note: >-
    Self-described schema_version "a2a-like-mvp-1". Method names (tasks/send) and the task-not-found code
    (404 rather than -32001) follow pre-0.3 drafts; the canonical card's top-level url is the origin rather
    than the JSON-RPC endpoint. See the deviations list in a2a/.
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  verification: observed
  domain_standard_signature: true
  evidence: >-
    (1) https://a2a.elonsusk.com/.well-known/x402.json (200, application/json, 21,853 bytes): x402Version 2,
    headers {challenge PAYMENT-REQUIRED, retry PAYMENT-SIGNATURE, settle PAYMENT-RESPONSE}, flow
    [challenge, sign, retry, settle], 27 endpoints each with priceUsd, network[] in CAIP-2, rails[] of
    {network, asset, payTo}, inputSchema and outputSchema. (2) POST https://a2a.elonsusk.com/x402/util.json.format
    with a JSON body and no payment header returned HTTP 402 with a PAYMENT-REQUIRED response header whose
    base64 payload decodes to exactly the JSON body: {x402Version 2, error "PAYMENT-SIGNATURE header is
    required", resource {url, description, mimeType}, accepts [{scheme exact, network eip155:8453, amount
    "2000", asset 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 (USDC on Base), payTo, maxTimeoutSeconds 120,
    extra {amountUsd 0.002, facilitator https://facilitator.payai.network, settlement
    facilitator_or_invoice_bridge, verification evm_rpc}}, {scheme exact, network
    solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp, asset EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v (USDC on
    Solana), ...}], extensions {bazaar {info, schema}, a2a {info, schema}}}. (3) The OpenAPI's
    x402_pay_per_call_x402__skill__post description states "Without PAYMENT-SIGNATURE → 402 + PAYMENT-REQUIRED.
    With valid signature → settle, create A2A task (marked paid), return receipt + artifact." (4) An unknown
    skill (POST /x402/not.a.skill) returns 404, so the 402 is per-resource, not a blanket gate.
  note: >-
    The challenge leg is fully observed. The sign/retry/settle legs were not exercised because they move
    funds; the PAYMENT-RESPONSE header and the receipt shape are recorded on the provider's declaration only.
    This is the domain-standard signature for the agent-commerce market: a discovery document plus a live,
    per-resource, schema-carrying 402 that a paying agent can act on with no bespoke integration.
