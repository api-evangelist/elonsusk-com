- id: openapi-3.1
  conforms: true
  version: 3.1.0
  evidence: openapi/elonsusk-com-openapi.json (fetched from https://a2a.elonsusk.com/openapi.json) — openapi "3.1.0"; parses; 24 paths, 24 operations, 5 component schemas; Swagger UI at /docs and ReDoc at /redoc.
  gaps:
  - No servers[] block; the base is recorded from the host it is served on and the card's baseUrl.
  - No securitySchemes and no security — the contract cannot express that access is payment-gated.
  - No tags declared or applied; operationIds are FastAPI auto-generated (create_task_v1_tasks_post).
  - Only 200 and 422 are declared; the 402 on /x402/{skill}, the 404 on unknown tasks/skills and the 405 on wrong methods are all observed and undeclared.
  - Response schemas are untyped objects (additionalProperties true); the Task, Quote, Invoice and Payment shapes appear only in live responses.
  - Operator-side operations (mark-paid, payment webhooks, showcase pages, healthz.earn.superteam) are published in the same contract with no audience marking.
