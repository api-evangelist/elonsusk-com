model: >-
  Pay-per-use in crypto, two ways: (a) x402 pay-per-call micropayments per skill, priced in USD and settled
  in USDC on Base or Solana at call time; (b) quote-first tasks — POST /v1/tasks (or A2A tasks/send)
  returns a USD quote and a multi-chain invoice (SOL, USDC on Solana, ETH, USDC on Ethereum, BTC) with the
  task id as the required memo, and the work starts once the payment watcher or a provider webhook marks it
  paid. Three fixed packages sit on top of the quote model. No subscription, no account, no fiat.
summary: >-
  Prices below are read from the agent card's pricing block, the per-skill priceUsd fields, the landing
  page's package cards and /.well-known/x402.json, all fetched 2026-09-19. The card's flat_min_usd is 1.0;
  the one publicly visible completed task (a shell.run smoke test from 2026-07-20) was quoted with
  flat_min_usd 0.25, so the minimum has been raised since. Token metering applies to the model-backed
  skills; the 24 keyless skills are flat per call.
