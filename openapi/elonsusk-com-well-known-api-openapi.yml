openapi: 3.2.0
info:
  title: A2A Autonomous Trader Agent .well Known API
  version: 0.1.0
tags:
- name: .well Known
paths:
  /.well-known/agent-card.json:
    get:
      summary: Agent Card
      operationId: agent_card__well_known_agent_card_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Agent Card  Well Known Agent Card Json Get
      tags:
      - .well Known
  /.well-known/agent.json:
    get:
      summary: Agent Card Alias
      operationId: agent_card_alias__well_known_agent_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Agent Card Alias  Well Known Agent Json Get
      tags:
      - .well Known
  /.well-known/agents.json:
    get:
      summary: Agents Manifest
      operationId: agents_manifest__well_known_agents_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Agents Manifest  Well Known Agents Json Get
      tags:
      - .well Known
  /.well-known/402index-verify.txt:
    get:
      summary: Well Known 402Index Verify
      description: 'Serve the 402index.io domain-ownership proof.


        402index grants instant approval to our pending x402 listings when the

        hash it issued is served here. The hash lives in a data file so it can be

        refreshed on re-verification without a code change. A specific route (not

        a catch-all) so it never shadows /.well-known/x402.json et al.'
      operationId: well_known_402index_verify__well_known_402index_verify_txt_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Well Known 402Index Verify  Well Known 402Index Verify Txt Get
      tags:
      - .well Known
  /.well-known/x402.json:
    get:
      summary: X402 Discovery
      description: 'Advertise x402 pay-per-call endpoints + classic invoice rail.


        Only what is deliverable right now: a listing that promises skills the

        offline model cannot run just sends buyers into a 503.'
      operationId: x402_discovery__well_known_x402_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response X402 Discovery  Well Known X402 Json Get
      tags:
      - .well Known
