async_model:
  style: polling
  description: >-
    Tasks are asynchronous: create returns immediately in state quoted/payment_required; the client polls
    GET /v1/tasks/{task_id} or JSON-RPC tasks/get until completed, failed or canceled. The card declares
    streaming false and pushNotifications false; stateTransitionHistory true is honoured by the Task's
    events[] array (one {at, state, ...} per transition). No outbound webhooks exist; the only webhook
    route is INBOUND from payment providers.
  task_states: [submitted, quoted, payment_required, paid, working, awaiting_human_response, completed, failed, canceled]
x402:
  version: 2
  challenge_header: PAYMENT-REQUIRED
  retry_header: PAYMENT-SIGNATURE
  settle_header: PAYMENT-RESPONSE
  amount_units: atomic units of the asset as a string ("2000" = 0.002 USDC at 6 decimals)
  max_timeout_seconds: 120
  discovery: https://a2a.elonsusk.com/.well-known/x402.json
  observed: POST /x402/util.json.format -> 402; header payload == body; two accepts[] (Base USDC, Solana USDC); facilitator https://facilitator.payai.network
skill_identity:
  note: >-
    The skill id (e.g. util.hash) is the same string in the card's skills[].id, the x402 path segment
    (/x402/util.hash), the REST body field CreateTaskRequest.skill, the JSON-RPC params.skill, and
    GET /health skills[]. GET /health lists 30 ids; the card declares 28 (shell.run and file.deliver absent).
