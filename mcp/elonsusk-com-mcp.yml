  JSON 404, no MCP package is published in any registry, and neither the agent card nor the landing page
  mentions one — although the agent SELLS an MCP-manifest security scan (skill security.mcp_scan, $0.02 per
  call over x402). The agent's machine surfaces are A2A JSON-RPC and x402 pay-per-call. The tool list below
  is a CANDIDATE derived one-to-one from the public, non-operator operations in the OpenAPI so that an MCP
  wrapper could be built; it is not a claim that the provider ships one.
