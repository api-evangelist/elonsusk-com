problem_types:
- status: 402
  title: Payment required (x402 challenge)
  occurrences: 1
  source_operations: [x402_pay_per_call_x402__skill__post]
  declared_in_contract: false
  causes:
  - No PAYMENT-SIGNATURE header on a priced skill ("PAYMENT-SIGNATURE header is required").
  remediation: >-
    Read accepts[] from the body or the PAYMENT-REQUIRED header, pay one of the offered rails (USDC on Base
    eip155:8453 or USDC on Solana, amount in atomic units — "2000" = $0.002 at 6 decimals), and retry the
    same request with PAYMENT-SIGNATURE. For the invoice-bridge path, accepts[].extra.note says to send USDC
    to payTo and retry with payload.tx_ref = the transaction hash, verified on-chain and usable for exactly
    one call. maxTimeoutSeconds is 120.
